
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CCT360: Contact</title>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <script type="module" src="js/bootstrap.bundle.min.js"></script>
        <script src="js/main.js" defer></script>
    </head>
    <body>
        <header>
            <nav class="navbar md:navbar-expand">
                <div class="container navigation">
                    <a href="index.html">
                        <img src="images/icon.png" alt="Logo" class="logo">
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#mobile-menu">
                        Menu
                    </button>

                    <dialog class="drawer drawer-end" id="mobile-menu">
                        <div class="drawer-header">
                            <h2 class="drawer-title">Navigation</h2>
                            <button class="btn-outline theme-primary" type="button" data-bs-dismiss="drawer">Close</button>
                        </div>

                        <div class="drawer-body">
                            <div class="navbar-nav nav-links">
                                <a class="nav-link" href="index.html">Home</a>
                                <a class="nav-link" href="detail.html">Case Study</a>
                                <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <button class="btn-outline theme-primary" type="button">Dark mode</button>
                                <span class="badge saved-counter">Saved: 0</span>
                            </div>
                        </div>
                    </dialog>
                </div>
            </nav>
        </header>

        <main class="container py-4">
            <section class="card">
                <h1>Contact Me</h1>
                <p class="lead">Share a few details about your project or idea and I’ll reach out asap!</p>
            </section>

            <section class="card">
                <h2>Send a Message</h2>

                <form id="contact-form" novalidate>
                    <div class="row g-4">
                        <div class="col-12 md:col-6">
                            <div class="form-field">
                                <label for="first-name" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="first-name" placeholder="First name" aria-describedby="first-name-error" required>
                                <p class="invalid-feedback" id="first-name-error" hidden></p>
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="form-field">
                                <label for="last-name" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="last-name" placeholder="Last name" aria-describedby="last-name-error" required>
                                <p class="invalid-feedback" id="last-name-error" hidden></p>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-field">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="you@example.com" aria-describedby="email-error" required>
                                <p class="invalid-feedback" id="email-error" hidden></p>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-field">
                                <label for="topic" class="form-label">Topic</label>
                                <select class="form-control" id="topic" aria-describedby="topic-error" required>
                                    <option value="">Select a topic</option>
                                    <option value="freelance">Freelance Project</option>
                                    <option value="collaboration">Collaboration</option>
                                    <option value="general">General Question</option>
                                    <option value="other">Other</option>
                                </select>
                                <p class="invalid-feedback" id="topic-error" hidden></p>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-field">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="6" maxlength="500" placeholder="Tell me about your project or idea!" aria-describedby="message-error character-count" required></textarea>
                                <p class="invalid-feedback" id="message-error" hidden></p>
                                <p class="text-end character-count" id="character-count">0 / 500 characters</p>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-field">
                                <div class="d-flex align-items-center gap-2 consent-field">
                                    <input type="checkbox" class="check" id="consent" aria-describedby="consent-error" required>
                                    <label for="consent">I consent to the use of my information.</label>
                                </div>
                                <p class="invalid-feedback" id="consent-error" hidden></p>
                            </div>
                        </div>

                        <div class="col-12">
                            <button class="btn-outline theme-primary" type="submit">Send</button>
                        </div>
                    </div>

                    <div class="confirmation-message mt-4" id="confirmation-message" tabindex="-1" hidden>
                    </div>
                </form>
            </section>
        </main>

        <footer class="container mt-4">
            <div class="site-footer">
                <p class="footer-text">© 2026 Brand Identity: CCT360</p>
                <a href="https://github.com/gianno36">GitHub</a>
            </div>
        </footer>
    </body>
</html>
